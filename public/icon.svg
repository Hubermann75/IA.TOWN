<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1E"/>
      <stop offset="50%" stop-color="#0E162E"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00EDFF"/>
      <stop offset="50%" stop-color="#8A2BFF"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00EDFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8A2BFF" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark cyber background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Circuit grid lines -->
  <path d="M60 120 H452 M60 256 H452 M60 392 H452" stroke="#1A2744" stroke-width="2" stroke-dasharray="8 8"/>
  <path d="M120 60 V452 M256 60 V452 M392 60 V452" stroke="#1A2744" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Outer Hexagonal Emblem -->
  <polygon points="256,64 424,160 424,352 256,448 88,352 88,160" 
           fill="none" stroke="url(#cyberBorder)" stroke-width="12" filter="url(#glow)"/>
  
  <!-- Inner Hexagon Frame -->
  <polygon points="256,96 396,176 396,336 256,416 116,336 116,176" 
           fill="#0F172A" fill-opacity="0.85" stroke="#00EDFF" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Stylized IA TOWN Core Symbol (Delta Peak / Skyscraper Gateway) -->
  <path d="M256 128 L348 288 H164 Z" fill="url(#innerGlow)" stroke="#00EDFF" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Centered Central Vault Diamond -->
  <polygon points="256,220 286,260 256,300 226,260" fill="#FFB800" stroke="#FFE600" stroke-width="3" filter="url(#glow)"/>
  
  <!-- High-Tech Nodes and Connections -->
  <circle cx="256" cy="128" r="8" fill="#00EDFF" filter="url(#glow)"/>
  <circle cx="164" cy="288" r="8" fill="#8A2BFF" filter="url(#glow)"/>
  <circle cx="348" cy="288" r="8" fill="#00EDFF" filter="url(#glow)"/>
  <circle cx="256" cy="380" r="10" fill="#FFB800" filter="url(#glow)"/>

  <!-- Core Circuit Traces to Bottom Core -->
  <path d="M256 300 V380" stroke="#00EDFF" stroke-width="6" stroke-linecap="round"/>
  <path d="M200 360 H312" stroke="#8A2BFF" stroke-width="4" stroke-linecap="round"/>

  <!-- Text / Brand Submark -->
  <text x="256" y="420" font-family="'Orbitron', sans-serif" font-size="26" font-weight="900" fill="#00EDFF" text-anchor="middle" letter-spacing="4">IA TOWN</text>
</svg>
