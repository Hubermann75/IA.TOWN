<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="m-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1E"/>
      <stop offset="50%" stop-color="#0E162E"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="m-cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00EDFF"/>
      <stop offset="50%" stop-color="#8A2BFF"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    <linearGradient id="m-innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00EDFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8A2BFF" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="m-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full-bleed background for maskable (Android requirement) -->
  <rect width="512" height="512" fill="url(#m-bg)"/>

  <!-- Centered content scaled into safe 80% circle (center 256, 256) -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <!-- Circuit grid lines -->
    <path d="M60 120 H452 M60 256 H452 M60 392 H452" stroke="#1A2744" stroke-width="2" stroke-dasharray="8 8"/>
    <path d="M120 60 V452 M256 60 V452 M392 60 V452" stroke="#1A2744" stroke-width="2" stroke-dasharray="8 8"/>

    <!-- Outer Hexagonal Emblem -->
    <polygon points="256,64 424,160 424,352 256,448 88,352 88,160" 
             fill="none" stroke="url(#m-cyberBorder)" stroke-width="14" filter="url(#m-glow)"/>
    
    <!-- Inner Hexagon Frame -->
    <polygon points="256,96 396,176 396,336 256,416 116,336 116,176" 
             fill="#0F172A" fill-opacity="0.9" stroke="#00EDFF" stroke-width="5" stroke-opacity="0.7"/>

    <!-- Core Delta Peak -->
    <path d="M256 128 L348 288 H164 Z" fill="url(#m-innerGlow)" stroke="#00EDFF" stroke-width="10" stroke-linejoin="round"/>
    
    <!-- Diamond Vault -->
    <polygon points="256,220 286,260 256,300 226,260" fill="#FFB800" stroke="#FFE600" stroke-width="4" filter="url(#m-glow)"/>
    
    <!-- Nodes -->
    <circle cx="256" cy="128" r="9" fill="#00EDFF" filter="url(#m-glow)"/>
    <circle cx="164" cy="288" r="9" fill="#8A2BFF" filter="url(#m-glow)"/>
    <circle cx="348" cy="288" r="9" fill="#00EDFF" filter="url(#m-glow)"/>
    <circle cx="256" cy="376" r="11" fill="#FFB800" filter="url(#m-glow)"/>

    <path d="M256 300 V376" stroke="#00EDFF" stroke-width="8" stroke-linecap="round"/>
    <path d="M200 355 H312" stroke="#8A2BFF" stroke-width="5" stroke-linecap="round"/>

    <text x="256" y="416" font-family="'Orbitron', sans-serif" font-size="28" font-weight="900" fill="#00EDFF" text-anchor="middle" letter-spacing="4">IA TOWN</text>
  </g>
</svg>
